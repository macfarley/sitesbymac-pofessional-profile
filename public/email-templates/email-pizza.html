<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="x-apple-disable-message-reformatting" />
  <!--[if !mso]><!-->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!--<![endif]-->
  <title>{{subject}}</title>
  <style type="text/css">
    /* Google Font — decorative serif for non-Outlook clients */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap');

    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse !important; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; background-color: #1a0000; width: 100% !important; min-width: 100%; }

    .wordmark {
      font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
      font-size: 34px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }
    .tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 12px;
      font-style: italic;
      color: rgba(255,220,180,0.85);
      letter-spacing: 0.12em;
    }
    .body-copy {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 15px;
      color: #1a0000;
      line-height: 1.7;
    }
    .signature-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: #8b1a1a;
    }

    @media screen and (max-width: 600px) {
      .email-container { width: 100% !important; max-width: 100% !important; }
      .pad-mobile { padding: 20px 16px !important; }
    }
  </style>
  <!--[if mso]>
  <style type="text/css">
    body, table, td, .wordmark, .tagline, .body-copy { font-family: Georgia, 'Times New Roman', serif !important; }
  </style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#1a0000;width:100%;">

<!-- ── OUTER WRAPPER ──────────────────────────────────── -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
  style="background-color:#1a0000;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <!-- ── EMAIL CONTAINER ──────────────────────────── -->
      <table role="presentation" class="email-container" width="600" cellpadding="0"
        cellspacing="0" border="0"
        style="max-width:600px;width:100%;background-color:#fffdf9;
               border:3px solid #8b1a1a;overflow:hidden;">

        <!-- ── TOP STRIPE ───────────────────────────── -->
        <tr>
          <td style="background-color:#8b1a1a;height:6px;font-size:0;line-height:0;">&nbsp;</td>
        </tr>

        <!-- ── HEADER ───────────────────────────────── -->
        <tr>
          <td align="center"
            style="background-color:#1a0000;padding:28px 32px 22px;
                   border-bottom:2px solid #8b1a1a;">
            <!-- Wordmark: the V is the pizza emoji -->
            <p class="wordmark"
              style="font-family:'Playfair Display',Georgia,'Times New Roman',serif;
                     font-size:34px;font-weight:900;color:#ffffff;
                     letter-spacing:0.04em;line-height:1.1;margin:0;">
              {{brandName}}
            </p>
            <p class="tagline"
              style="font-family:'Playfair Display',Georgia,serif;font-size:12px;
                     font-style:italic;color:rgba(255,220,180,0.85);
                     letter-spacing:0.12em;margin:8px 0 0;">
              {{brandTagline}}
            </p>
          </td>
        </tr>

        <!-- ── HEADLINE BAND ─────────────────────────── -->
        <tr>
          <td align="center"
            style="background-color:#8b1a1a;padding:16px 32px;">
            <p style="margin:0;font-family:'Playfair Display',Georgia,serif;
                      font-size:20px;font-weight:700;color:#ffffff;
                      letter-spacing:0.03em;line-height:1.3;">
              {{headline}}
            </p>
          </td>
        </tr>

        <!-- ── MAIN BODY ─────────────────────────────── -->
        <tr>
          <td class="pad-mobile" style="padding:28px 36px;">

            <!-- Greeting -->
            <p class="body-copy"
              style="font-family:Georgia,'Times New Roman',serif;font-size:15px;
                     color:#1a0000;line-height:1.7;margin:0 0 14px;">
              {{salutation}},
            </p>

            <!-- Body paragraphs -->
            {{#each paragraphs}}
            <p class="body-copy"
              style="font-family:Georgia,'Times New Roman',serif;font-size:15px;
                     color:#2a0a0a;line-height:1.7;margin:0 0 14px;">
              {{text}}
            </p>
            {{/each}}

            <!-- Decorative rule -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
              style="margin:22px 0;">
              <tr>
                <td style="border-top:1px solid #c9a87c;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>

            <!-- Closing -->
            <p style="margin:0 0 2px;font-family:Georgia,serif;font-size:15px;
                      color:#2a0a0a;line-height:1.6;">
              {{closing}},
            </p>
            <p class="signature-name"
              style="font-family:'Playfair Display',Georgia,serif;font-size:18px;
                     font-weight:700;color:#8b1a1a;margin:6px 0 2px;line-height:1.3;">
              {{senderName}}
            </p>
            <p style="margin:0;font-family:Georgia,serif;font-size:13px;
                      color:#666;line-height:1.6;font-style:italic;">
              {{senderTitle}}
            </p>
            <p style="margin:2px 0 0;font-family:Georgia,serif;font-size:13px;
                      color:#666;line-height:1.6;">
              <a href="mailto:{{senderEmail}}"
                style="color:#8b1a1a;text-decoration:none;">{{senderEmail}}</a>
            </p>

          </td>
        </tr>

        <!-- ── BOTTOM STRIPE ─────────────────────────── -->
        <tr>
          <td style="background-color:#8b1a1a;height:4px;font-size:0;line-height:0;">&nbsp;</td>
        </tr>

        <!-- ── FOOTER ─────────────────────────────────── -->
        <tr>
          <td align="center"
            style="background-color:#1a0000;padding:14px 32px 18px;">
            <p style="margin:0;font-family:Georgia,serif;font-size:11px;
                      color:rgba(255,200,160,0.7);line-height:1.6;
                      font-style:italic;letter-spacing:0.05em;">
              {{footerLine1}}
            </p>
            <p style="margin:4px 0 0;font-family:Georgia,serif;font-size:10px;
                      color:rgba(255,200,160,0.5);line-height:1.6;">
              {{footerLine2}}
            </p>
          </td>
        </tr>

      </table>
      <!-- END EMAIL CONTAINER -->

    </td>
  </tr>
</table>

</body>
</html>
